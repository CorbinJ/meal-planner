<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> Meal Planner Pro
            </h1>
            <div class="text-xs bg-emerald-700 px-2 py-1 rounded-full font-medium">
                Google Sheets & Delete Ready
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 pb-24">

        <!-- TAB 1: LOG MEAL -->
        <section id="tab-log" class="tab-content active">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-camera text-emerald-600"></i> Log a New Meal
                </h2>

                <form id="meal-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Meal Name</label>
                        <input type="text" id="meal-name" required placeholder="e.g., Creamy Pesto Salmon & Asparagus" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Category</label>
                            <select id="meal-category" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white">
                                <option value="">Select Category...</option>
                                <option value="Pasta Dish">Pasta Dish</option>
                                <option value="Rice Dish">Rice Dish</option>
                                <option value="Soup / Curry">Soup / Curry</option>
                                <option value="Tacos / Wraps">Tacos / Wraps</option>
                                <option value="Seafood">Seafood</option>
                                <option value="Chicken / Poultry">Chicken / Poultry</option>
                                <option value="Beef / Pork">Beef / Pork</option>
                                <option value="Vegetarian">Vegetarian</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Date Prepared</label>
                            <input type="date" id="meal-date" required 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Recipe / Instructions</label>
                        <textarea id="meal-recipe" rows="3" placeholder="Brief steps or notes..." 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Ingredients (comma separated for grocery list)</label>
                        <input type="text" id="meal-ingredients" placeholder="e.g., salmon fillets, heavy cream, pesto, asparagus, garlic" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Meal Photo</label>
                        <input type="file" id="meal-photo" accept="image/*" capture="environment" 
                            class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                    </div>

                    <div id="photo-preview-container" class="hidden mt-2">
                        <img id="photo-preview" class="h-32 object-cover rounded-xl border border-slate-200 shadow-sm" alt="Preview">
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-sm">
                        Save Meal to History
                    </button>
                </form>
            </div>
        </section>

        <!-- TAB 2: HISTORY / SPREADSHEET -->
        <section id="tab-history" class="tab-content">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-table text-emerald-600"></i> Meal Spreadsheet & History
                    </h2>
                    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                        <button onclick="exportToCSV()" class="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg transition">
                            <i class="fa-solid fa-download mr-1"></i> Export CSV
                        </button>
                        <button onclick="exportToGoogleSheetsCSV()" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition shadow-sm" title="Download CSV formatted specifically for Google Sheets upload">
                            <i class="fa-brands fa-google-drive mr-1"></i> Google Sheets CSV
                        </button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    <input type="text" id="search-history" placeholder="Search meals or ingredients..." oninput="renderHistory()" 
                        class="px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <select id="filter-category" onchange="renderHistory()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="">All Categories</option>
                        <option value="Pasta Dish">Pasta Dish</option>
                        <option value="Rice Dish">Rice Dish</option>
                        <option value="Soup / Curry">Soup / Curry</option>
                        <option value="Tacos / Wraps">Tacos / Wraps</option>
                        <option value="Seafood">Seafood</option>
                        <option value="Chicken / Poultry">Chicken / Poultry</option>
                        <option value="Beef / Pork">Beef / Pork</option>
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Spreadsheet Table View -->
                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-bold">
                            <tr>
                                <th class="p-3">Photo</th>
                                <th class="p-3">Date</th>
                                <th class="p-3">Meal Name</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Ingredients</th>
                                <th class="p-3 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="divide-y divide-slate-200 bg-white">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 3: WEEKLY PLANNER -->
        <section id="tab-planner" class="tab-content">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-emerald-600"></i> Weekly Meal Planner
                    </h2>
                    <button onclick="generateGroceryListFromPlan()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition shadow-sm">
                        <i class="fa-solid fa-list-check mr-1"></i> Generate Grocery List
                    </button>
                </div>

                <div id="weekly-planner-container" class="space-y-3">
                    <!-- Populated dynamically for Mon-Sun -->
                </div>
            </div>
        </section>

        <!-- TAB 4: GROCERY LIST -->
        <section id="tab-grocery" class="tab-content">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-emerald-600"></i> Weekly Grocery List
                </h2>
                
                <div class="flex gap-2 mb-4">
                    <input type="text" id="manual-grocery-item" placeholder="Add extra item (e.g., olive oil, eggs)..." 
                        class="flex-grow px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button onclick="addManualGrocery()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-semibold text-sm transition">
                        Add
                    </button>
                </div>

                <div id="grocery-list-container" class="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50">
        <div class="max-w-4xl mx-auto grid grid-cols-4 py-2">
            <button onclick="switchTab('log')" id="nav-log" class="flex flex-col items-center justify-center text-emerald-600 transition">
                <i class="fa-solid fa-camera text-lg mb-1"></i>
                <span class="text-xs font-medium">Log Meal</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-table text-lg mb-1"></i>
                <span class="text-xs font-medium">History</span>
            </button>
            <button onclick="switchTab('planner')" id="nav-planner" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-calendar-days text-lg mb-1"></i>
                <span class="text-xs font-medium">Planner</span>
            </button>
            <button onclick="switchTab('grocery')" id="nav-grocery" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-basket-shopping text-lg mb-1"></i>
                <span class="text-xs font-medium">Grocery</span>
            </button>
        </div>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        // State Management
        let meals = JSON.parse(localStorage.getItem('
