<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> Meal Planner Pro
            </h1>
            <div id="form-mode-badge" class="text-xs bg-emerald-700 px-2 py-1 rounded-full font-medium">
                Log Mode
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 pb-24">

        <!-- TAB 1: LOG / EDIT MEAL -->
        <section id="tab-log" class="tab-content active">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="form-title" class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-camera text-emerald-600"></i> Log a New Meal
                    </h2>
                    <button type="button" id="cancel-edit-btn" onclick="resetMealForm()" class="hidden text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-1 px-2.5 rounded-lg transition">
                        Cancel Edit
                    </button>
                </div>

                <form id="meal-form" class="space-y-4">
                    <input type="hidden" id="edit-meal-id" value="">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Meal Name</label>
                        <input type="text" id="meal-name" required placeholder="e.g., Creamy Pesto Salmon & Asparagus" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Category</label>
                            <select id="meal-category" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white">
                                <option value="">Select Category...</option>
                                <option value="Pasta Dish">Pasta Dish</option>
                                <option value="Rice Dish">Rice Dish</option>
                                <option value="Soup / Curry">Soup / Curry</option>
                                <option value="Tacos / Wraps">Tacos / Wraps</option>
                                <option value="Seafood">Seafood</option>
                                <option value="Chicken / Poultry">Chicken / Poultry</option>
                                <option value="Beef / Pork">Beef / Pork</option>
                                <option value="Vegetarian">Vegetarian</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Date Prepared</label>
                            <input type="date" id="meal-date" required 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Recipe / Instructions</label>
                        <textarea id="meal-recipe" rows="3" placeholder="Brief steps or notes..." 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Ingredients (comma separated for grocery list)</label>
                        <input type="text" id="meal-ingredients" placeholder="e.g., salmon fillets, heavy cream, pesto, asparagus, garlic" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Meal Photo</label>
                        <input type="file" id="meal-photo" accept="image/*" capture="environment" 
                            class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                    </div>

                    <div id="photo-preview-container" class="hidden mt-2">
                        <img id="photo-preview" class="h-32 object-cover rounded-xl border border-slate-200 shadow-sm" alt="Preview">
                    </div>

                    <button type="submit" id="form-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-sm">
                        Save Meal to History
                    </button>
                </form>
            </div>
        </section>

        <!-- TAB 2: HISTORY / SPREADSHEET -->
        <section id="tab-history" class="tab-content">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-table text-emerald-600"></i> Meal Spreadsheet & History
                    </h2>
                    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                        <button onclick="exportToCSV()" class="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg transition">
                            <i class="fa-solid fa-download mr-1"></i> Export CSV
                        </button>
                        <button onclick="exportToGoogleSheetsCSV()" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition shadow-sm" title="Download CSV formatted specifically for Google Sheets upload">
                            <i class="fa-brands fa-google-drive mr-1"></i> Google Sheets CSV
                        </button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    <input type="text" id="search-history" placeholder="Search meals or ingredients..." oninput="renderHistory()" 
                        class="px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <select id="filter-category" onchange="renderHistory()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="">All Categories</option>
                        <option value="Pasta Dish">Pasta Dish</option>
                        <option value="Rice Dish">Rice Dish</option>
                        <option value="Soup / Curry">Soup / Curry</option>
                        <option value="Tacos / Wraps">Tacos / Wraps</option>
                        <option value="Seafood">Seafood</option>
                        <option value="Chicken / Poultry">Chicken / Poultry</option>
                        <option value="Beef / Pork">Beef / Pork</option>
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Spreadsheet Table View -->
                <div class="overflow-x-auto rounded-xl border border-slate-200 mb-4">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-bold">
                            <tr>
                                <th class="p-3">Photo</th>
                                <th class="p-3">Date</th>
                                <th class="p-3">Meal Name</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Ingredients</th>
                                <th class="p-3 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="divide-y divide-slate-200 bg-white">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>

                <!-- CSV Import Backup Section -->
                <div class="pt-4 border-t border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-50 p-4 rounded-xl">
                    <div>
                        <span class="block text-xs font-bold text-slate-700">Restore Backup</span>
                        <span class="text-xs text-slate-500">Upload a previously exported `meal_history.csv` file to restore your meals.</span>
                    </div>
                    <input type="file" id="csv-import-file" accept=".csv" class="text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>
            </div>
        </section>

        <!-- TAB 3: WEEKLY PLANNER -->
        <section id="tab-planner" class="tab-content">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-emerald-600"></i> Weekly Meal Planner
                    </h2>
                    <button onclick="generateGroceryListFromPlan()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition shadow-sm">
                        <i class="fa-solid fa-list-check mr-1"></i> Generate Grocery List
                    </button>
                </div>

                <div id="weekly-planner-container" class="space-y-3">
                    <!-- Populated dynamically for Mon-Sun -->
                </div>
            </div>
        </section>

        <!-- TAB 4: GROCERY LIST -->
        <section id="tab-grocery" class="tab-content">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-emerald-600"></i> Weekly Grocery List
                </h2>
                
                <div class="flex gap-2 mb-4">
                    <input type="text" id="manual-grocery-item" placeholder="Add extra item (e.g., olive oil, eggs)..." 
                        class="flex-grow px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button onclick="addManualGrocery()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-semibold text-sm transition">
                        Add
                    </button>
                </div>

                <div id="grocery-list-container" class="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50">
        <div class="max-w-4xl mx-auto grid grid-cols-4 py-2">
            <button onclick="switchTab('log')" id="nav-log" class="flex flex-col items-center justify-center text-emerald-600 transition">
                <i class="fa-solid fa-camera text-lg mb-1"></i>
                <span class="text-xs font-medium">Log Meal</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-table text-lg mb-1"></i>
                <span class="text-xs font-medium">History</span>
            </button>
            <button onclick="switchTab('planner')" id="nav-planner" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-calendar-days text-lg mb-1"></i>
                <span class="text-xs font-medium">Planner</span>
            </button>
            <button onclick="switchTab('grocery')" id="nav-grocery" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-basket-shopping text-lg mb-1"></i>
                <span class="text-xs font-medium">Grocery</span>
            </button>
        </div>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        // State Management
        let meals = JSON.parse(localStorage.getItem('mp_meals')) || [];
        let weeklyPlan = JSON.parse(localStorage.getItem('mp_weeklyPlan')) || {
            'Monday': '', 'Tuesday': '', 'Wednesday': '', 'Thursday': '', 'Friday': '', 'Saturday': '', 'Sunday': ''
        };
        let groceryList = JSON.parse(localStorage.getItem('mp_groceryList')) || [];

        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        const dateInput = document.getElementById('meal-date');
        if (dateInput) dateInput.valueAsDate = new Date();

        // Image Base64 Handler
        let currentPhotoBase64 = '';
        const photoInput = document.getElementById('meal-photo');
        if (photoInput) {
            photoInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        currentPhotoBase64 = event.target.result;
                        const preview = document.getElementById('photo-preview');
                        if (preview) preview.src = currentPhotoBase64;
                        const container = document.getElementById('photo-preview-container');
                        if (container) container.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // CSV Import Handler
        const csvImportInput = document.getElementById('csv-import-file');
        if (csvImportInput) {
            csvImportInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    parseAndImportCSV(event.target.result);
                    e.target.value = '';
                };
                reader.readAsText(file);
            });
        }

        function parseAndImportCSV(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) {
                alert('Invalid CSV file format.');
                return;
            }

            let importedCount = 0;
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const row = [];
                let inQuote = false;
                let currentVal = '';
                for (let c = 0; c < line.length; c++) {
                    const char = line[c];
                    if (char === '"') {
                        if (inQuote && line[c + 1] === '"') {
                            currentVal += '"';
                            c++;
                        } else {
                            inQuote = !inQuote;
                        }
                    } else if (char === ',' && !inQuote) {
                        row.push(currentVal);
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal);

                if (row.length >= 4) {
                    const date = row[0] || new Date().toISOString().split('T')[0];
                    const name = row[1] || 'Imported Meal';
                    const category = row[2] || 'Other';
                    const ingredients = row[3] || '';
                    const recipe = row[4] || '';

                    const newMeal = {
                        id: (Date.now() + i).toString(),
                        name: name,
                        category: category,
                        date: date,
                        recipe: recipe,
                        ingredients: ingredients,
                        photo: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=150&q=80'
                    };
                    meals.unshift(newMeal);
                    importedCount++;
                }
            }

            if (importedCount > 0) {
                saveData();
                alert(`Successfully imported ${importedCount} meals from CSV!`);
                switchTab('history');
            } else {
                alert('No valid meal rows found in the CSV file.');
            }
        }

        // Form Submission (Handles both Create and Edit)
        const mealForm = document.getElementById('meal-form');
        if (mealForm) {
            mealForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const editId = document.getElementById('edit-meal-id').value;
                const name = document.getElementById('meal-name').value;
                const category = document.getElementById('meal-category').value;
                const date = document.getElementById('meal-date').value;
                const recipe = document.getElementById('meal-recipe').value;
                const ingredients = document.getElementById('meal-ingredients').value;

                if (editId) {
                    // Update existing meal
                    const meal = meals.find(m => m.id === editId);
                    if (meal) {
                        meal.name = name;
                        meal.category = category;
                        meal.date = date;
                        meal.recipe = recipe;
                        meal.ingredients = ingredients;
                        if (currentPhotoBase64) {
                            meal.photo = currentPhotoBase64;
                        }
                    }
                    alert('Meal updated successfully!');
                } else {
                    // Create new meal
                    const newMeal = {
                        id: Date.now().toString(),
                        name: name,
                        category: category,
                        date: date,
                        recipe: recipe,
                        ingredients: ingredients,
                        photo: currentPhotoBase64 || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=150&q=80'
                    };
                    meals.unshift(newMeal);
                    alert('Meal saved successfully!');
                }

                saveData();
                resetMealForm();
                switchTab('history');
            });
        }

        function editMeal(id) {
            const meal = meals.find(m => m.id === id);
            if (!meal) return;

            document.getElementById('edit-meal-id').value = meal.id;
            document.getElementById('meal-name').value = meal.name || '';
            document.getElementById('meal-category').value = meal.category || '';
            document.getElementById('meal-date').value = meal.date || new Date().toISOString().split('T')[0];
            document.getElementById('meal-recipe').value = meal.recipe || '';
            document.getElementById('meal-ingredients').value = meal.ingredients || '';

            // Show preview if exists
            if (meal.photo) {
                const preview = document.getElementById('photo-preview');
                if (preview) preview.src = meal.photo;
                const container = document.getElementById('photo-preview-container');
                if (container) container.classList.remove('hidden');
            }

            // Update UI headers for edit mode
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-emerald-600"></i> Edit Meal`;
            document.getElementById('form-mode-badge').innerText = `Edit Mode`;
            document.getElementById('form-submit-btn').innerText = `Update Meal`;
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            switchTab('log');
        }

        function resetMealForm() {
            document.getElementById('meal-form').reset();
            document.getElementById('edit-meal-id').value = '';
            currentPhotoBase64 = '';
            const container = document.getElementById('photo-preview-container');
            if (container) container.classList.add('hidden');
            if (dateInput) dateInput.valueAsDate = new Date();

            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-camera text-emerald-600"></i> Log a New Meal`;
            document.getElementById('form-mode-badge').innerText = `Log Mode`;
            document.getElementById('form-submit-btn').innerText = `Save Meal to History`;
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function saveData() {
            localStorage.setItem('mp_meals', JSON.stringify(meals));
            localStorage.setItem('mp_weeklyPlan', JSON.stringify(weeklyPlan));
            localStorage.setItem('mp_groceryList', JSON.stringify(groceryList));
            renderHistory();
            renderPlanner();
            renderGrocery();
        }

        // Delete Meal from History
        function deleteMeal(id) {
            if (confirm('Are you sure you want to delete this meal from history?')) {
                meals = meals.filter(m => m.id !== id);
                for (let day of daysOfWeek) {
                    if (weeklyPlan[day] === id) {
                        weeklyPlan[day] = '';
                    }
                }
                saveData();
            }
        }

        // Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('tab-' + tabId);
            if (target) target.classList.add('active');

            const navs = ['log', 'history', 'planner', 'grocery'];
            navs.forEach(n => {
                const btn = document.getElementById('nav-' + n);
                if (btn) {
                    if (n === tabId) {
                        btn.classList.remove('text-slate-400');
                        btn.classList.add('text-emerald-600');
                    } else {
                        btn.classList.remove('text-emerald-600');
                        btn.classList.add('text-slate-400');
                    }
                }
            });
            window.scrollTo(0, 0);
        }

        // Render History Table
        function renderHistory() {
            const tbody = document.getElementById('history-table-body');
            if (!tbody) return;
            const searchEl = document.getElementById('search-history');
            const search = searchEl ? searchEl.value.toLowerCase() : '';
            const catFilterEl = document.getElementById('filter-category');
            const catFilter = catFilterEl ? catFilterEl.value : '';

            const filtered = meals.filter(m => {
                const name = m.name || '';
                const ingredients = m.ingredients || '';
                const matchesSearch = name.toLowerCase().includes(search) || ingredients.toLowerCase().includes(search);
                const matchesCat = !catFilter || m.category === catFilter;
                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">No meals logged yet or matching search.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(m => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3">
                        <img src="${m.photo || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=150&q=80'}" class="w-12 h-12 object-cover rounded-lg border border-slate-200" alt="Meal">
                    </td>
                    <td class="p-3 whitespace-nowrap text-xs font-medium">${m.date || ''}</td>
                    <td class="p-3 font-semibold text-slate-800">${m.name || 'Unnamed Meal'}</td>
                    <td class="p-3"><span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold">${m.category || 'Other'}</span></td>
                    <td class="p-3 text-xs text-slate-500 max-w-xs truncate">${m.ingredients || 'None listed'}</td>
                    <td class="p-3 text-center whitespace-nowrap">
                        <button onclick="editMeal('${m.id}')" class="text-blue-500 hover:text-blue-700 p-1.5 rounded-lg transition mr-1" title="Edit meal">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteMeal('${m.id}')" class="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg transition" title="Delete meal">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Render Weekly Planner
        function renderPlanner() {
            const container = document.getElementById('weekly-planner-container');
            if (!container) return;
            container.innerHTML = daysOfWeek.map(day => {
                const assignedMealId = weeklyPlan[day];
                const options = meals.map(m => `<option value="${m.id}" ${m.id === assignedMealId ? 'selected' : ''}>${m.name || 'Meal'} (${m.category || 'Other'})</option>`).join('');
                
                return `
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-3 rounded-xl border border-slate-200 bg-slate-50/50 gap-2">
                        <span class="font-semibold text-slate-700 w-28">${day}</span>
                        <select onchange="updateWeeklyPlan('${day}', this.value)" class="w-full sm:w-auto flex-grow px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">-- Select a meal --</option>
                            ${options}
                        </select>
                    </div>
                `;
            }).join('');
        }

        function updateWeeklyPlan(day, mealId) {
            weeklyPlan[day] = mealId;
            localStorage.setItem('mp_weeklyPlan', JSON.stringify(weeklyPlan));
        }

        // Grocery List Generation
        function generateGroceryListFromPlan() {
            let extractedItems = [];
            daysOfWeek.forEach(day => {
                const mealId = weeklyPlan[day];
                if (mealId) {
                    const meal = meals.find(m => m.id === mealId);
                    if (meal && meal.ingredients) {
                        const items = meal.ingredients.split(',').map(i => i.trim()).filter(i => i.length > 0);
                        extractedItems.push(...items);
                    }
                }
            });

            const uniqueItems = [...new Set(extractedItems)];
            groceryList = uniqueItems.map(item => ({ text: item, completed: false }));
            saveData();
            switchTab('grocery');
            alert('Grocery list successfully updated from your weekly plan!');
        }

        function renderGrocery() {
            const container = document.getElementById('grocery-list-container');
            if (!container) return;
            if (groceryList.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Your grocery list is empty. Assign meals in the planner and click 'Generate Grocery List'.</div>`;
                return;
            }

            container.innerHTML = groceryList.map((item, index) => `
                <div class="flex items-center justify-between p-3.5 bg-white hover:bg-slate-50 transition">
                    <label class="flex items-center gap-3 cursor-pointer select-none flex-grow">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleGroceryItem(${index})" class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                        <span class="text-sm ${item.completed ? 'line-through text-slate-400' : 'text-slate-700'}">${item.text}</span>
                    </label>
                    <button onclick="removeGroceryItem(${index})" class="text-slate-400 hover:text-rose-500 p-1 transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');
        }

        function toggleGroceryItem(index) {
            groceryList[index].completed = !groceryList[index].completed;
            saveData();
        }

        function removeGroceryItem(index) {
            groceryList.splice(index, 1);
            saveData();
        }

        function addManualGrocery() {
            const input = document.getElementById('manual-grocery-item');
            if (!input) return;
            const val = input.value.trim();
            if (val) {
                groceryList.push({ text: val, completed: false });
                input.value = '';
                saveData();
            }
        }

        // CSV Export
        function exportToCSV() {
            if (meals.length === 0) {
                alert('No meals to export.');
                return;
            }
            let csv = 'Date,Meal Name,Category,Ingredients,Recipe\n';
            meals.forEach(m => {
                const date = m.date || '';
                const name = (m.name || '').replace(/"/g, '""');
                const cat = m.category || '';
                const ing = (m.ingredients || '').replace(/"/g, '""');
                const rec = (m.recipe || '').replace(/"/g, '""');
                csv += `"${date}","${name}","${cat}","${ing}","${rec}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'meal_history.csv');
            a.click();
        }

        function exportToGoogleSheetsCSV() {
            exportToCSV();
            if (confirm('CSV downloaded successfully!\n\nWould you like to open Google Sheets now to import it?')) {
                window.open('https://sheets.new', '_blank');
            }
        }

        // Initial Render
        renderHistory();
        renderPlanner();
        renderGrocery();
    </script>
</body>
</html>
